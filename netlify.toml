[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Run drip emails daily at 10am UTC (6am ET)
[functions."drip-day3"]
  schedule = "0 10 * * *"

[functions."drip-day7"]
  schedule = "0 10 * * *"

[functions."review-request"]
  schedule = "0 10 * * *"

# Redirect the .netlify.app subdomain to the apex domain to kill duplicate-content
# (GSC auto-registered carbinated-audio.netlify.app as a separate property 2026-04-12).
[[redirects]]
  from = "https://carbinated-audio.netlify.app/*"
  to = "https://carbonatedaudio.com/:splat"
  status = 301
  force = true

# Pretty URLs for product pages
[[redirects]]
  from = "/carbonator"
  to = "/carbonator.html"
  status = 200

[[redirects]]
  from = "/desipper"
  to = "/desipper.html"
  status = 200

[[redirects]]
  from = "/de-sipper"
  to = "/desipper.html"
  status = 301

[[redirects]]
  from = "/ontap"
  to = "/ontap.html"
  status = 200

[[redirects]]
  from = "/on-tap"
  to = "/ontap.html"
  status = 301
