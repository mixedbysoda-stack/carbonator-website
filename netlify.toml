[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Run drip emails daily at 10am UTC (6am ET)
[functions."drip-day3"]
  schedule = "0 10 * * *"

[functions."drip-day7"]
  schedule = "0 10 * * *"

[functions."review-request"]
  schedule = "0 10 * * *"

# Pretty URLs for product pages
[[redirects]]
  from = "/carbonator"
  to = "/carbonator.html"
  status = 200

[[redirects]]
  from = "/desipper"
  to = "/desipper.html"
  status = 200

[[redirects]]
  from = "/de-sipper"
  to = "/desipper.html"
  status = 301
