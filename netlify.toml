[build]
  publish = "."
  # Fails the deploy if a Stripe buy link is unmapped, or a selling page
  # is missing GA4 / checkout-tracking.js. See scripts/check-tracking.js
  # for why. Remove this line only if you want silent revenue gaps back.
  command = "node scripts/check-tracking.js"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Run drip emails daily at 10am UTC (6am ET)
[functions."drip-day3"]
  schedule = "0 10 * * *"

[functions."drip-day7"]
  schedule = "0 10 * * *"

[functions."review-request"]
  schedule = "0 10 * * *"

# ---------------------------------------------------------------------------
# HEADERS
# ---------------------------------------------------------------------------

# Global security headers (applies to every response, including HTML).
# Cache-Control here is the HTML default: always revalidate so content
# updates go live instantly. Asset-specific blocks below override per type.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
    # Clickjacking: nothing may frame the site except the site itself
    # (fizzfuel.html embeds /assets/fizzfuel-gearbox/ in a same-origin iframe,
    # so DENY would break that page).
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # REPORT-ONLY content security policy. It blocks nothing yet; violations
    # are POSTed to csp-report.js and show up in the function logs. Run it
    # for a couple of weeks, tighten from evidence, then rename the header to
    # Content-Security-Policy. 'unsafe-inline' is unavoidable today: every
    # page carries inline gtag/pixel snippets and onclick= handlers.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net https://*.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: data: https://github.com https://*.githubusercontent.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.facebook.com https://connect.facebook.net; frame-src 'self' https://www.googletagmanager.com https://buy.stripe.com https://js.stripe.com; frame-ancestors 'self'; form-action 'self' https://buy.stripe.com; base-uri 'self'; object-src 'none'; report-uri /.netlify/functions/csp-report"

# Static assets. Filenames are NOT content-hashed, so 1yr `immutable` is
# unsafe (a redeploy would be invisible to repeat visitors for a year).
# 7-day max-age + 1-day stale-while-revalidate: fast repeat visits, but a
# redeploy is picked up within a day via background revalidation.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Redirect the .netlify.app subdomain to the apex domain to kill duplicate-content
# (GSC auto-registered carbinated-audio.netlify.app as a separate property 2026-04-12).
[[redirects]]
  from = "https://carbinated-audio.netlify.app/*"
  to = "https://carbonatedaudio.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# NOT PUBLIC. publish="." serves the whole repo, so without these the function
# source, build scripts, email templates, outreach notes and the suppression
# list were all downloadable from the live site (confirmed 2026-09-03). Netlify
# functions are served from /.netlify/functions/*, a different path, so blocking
# /netlify/* is safe. 404.html is the branded not-found page.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

